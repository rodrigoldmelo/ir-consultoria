# Nginx sample — IR Consultoria API (isolada da Lis)
# Copiar para /etc/nginx/sites-available/ir.meuanalistacrm.app
# Lis continua em vec.meuanalistacrm.app → :3001 (NÃO alterar)

server {
    listen 80;
    server_name ir.meuanalistacrm.app;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Após validar:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ir.meuanalistacrm.app
